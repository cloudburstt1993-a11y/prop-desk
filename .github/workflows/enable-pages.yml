name: Enable Pages (one-time)

on:
  workflow_dispatch:

permissions:
  pages: write
  contents: read

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Turn on GitHub Pages from main / root with the custom domain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/pages" -f "source[branch]=main" -f "source[path]=/" || true
          gh api -X PUT "repos/${{ github.repository }}/pages" -f cname=props.bookcliffweb.com -f "source[branch]=main" -f "source[path]=/"
          gh api "repos/${{ github.repository }}/pages"
